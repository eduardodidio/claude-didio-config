<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hawk | Board</title>
<script>
  // Apply theme before paint to avoid flash
  (function(){
    var t = localStorage.getItem('didio-board-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    else if (!t && window.matchMedia('(prefers-color-scheme: light)').matches)
      document.documentElement.setAttribute('data-theme','light');
  })();
</script>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2129;
  --border: #30363d; --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
  --accent: #58a6ff; --green: #3fb950; --yellow: #d29922; --orange: #db6d28;
  --red: #f85149; --purple: #bc8cff; --cyan: #39d2c0;
  --shadow: rgba(0,0,0,0.3);
}
[data-theme="light"] {
  --bg: #ffffff; --surface: #f6f8fa; --surface2: #eaeef2;
  --border: #d0d7de; --text: #1f2328; --text-muted: #656d76; --text-dim: #8b949e;
  --accent: #0969da; --green: #1a7f37; --yellow: #9a6700; --orange: #bc4c00;
  --red: #cf222e; --purple: #8250df; --cyan: #0a7d6c;
  --shadow: rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Header */
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.logo span{color:var(--text-muted);font-weight:400;font-size:12px}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px}
.tabs button{padding:5px 14px;border:none;border-radius:5px;background:transparent;color:var(--text-muted);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:var(--accent);color:#fff}
.stats{margin-left:auto;display:flex;gap:10px;font-size:11px;color:var(--text-muted);align-items:center}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.icon-btn{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text-muted);cursor:pointer;font-size:14px}
.icon-btn:hover{background:var(--surface2);color:var(--text)}

/* Layout */
.main-area{display:flex;flex:1;overflow:hidden}
.board-area{flex:1;padding:12px 16px;overflow-x:auto}
.board{display:flex;gap:12px;min-height:calc(100vh - 100px)}
.board.hidden{display:none}

/* Columns */
.col{min-width:240px;max-width:280px;flex:1;display:flex;flex-direction:column;border-radius:8px;background:var(--surface)}
.col-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.col-h span:first-child{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.col-cnt{background:var(--border);border-radius:8px;padding:1px 7px;font-size:10px;font-weight:600;color:var(--text-muted)}
.col-body{padding:6px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.col-empty{padding:20px;text-align:center;color:var(--text-dim);font-size:12px;font-style:italic}

/* Cards — COMPACT */
.card{padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--accent);box-shadow:0 2px 8px var(--shadow)}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card-id{font-size:10px;font-family:monospace;color:var(--accent);font-weight:600}
.card-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.pbar{height:3px;background:var(--border);border-radius:2px;margin-top:6px}
.pbar-fill{height:100%;border-radius:2px;transition:width .3s}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;text-transform:uppercase}
.badge-high{background:rgba(248,81,73,.15);color:var(--red)}
.badge-medium{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge-low{background:rgba(139,148,158,.15);color:var(--text-muted)}
.badge-max{background:rgba(248,81,73,.3);color:var(--red)}
.badge-green{background:rgba(63,185,80,.15);color:var(--green)}
.badge-red{background:rgba(248,81,73,.15);color:var(--red)}
.badge-blue{background:rgba(88,166,255,.15);color:var(--accent)}

/* Command Center */
.cmd-panel{width:340px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.cmd-panel.collapsed{width:40px;min-width:40px}
.cmd-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cmd-header h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--orange)}
.cmd-toggle{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:14px}
.cmd-body{flex:1;overflow-y:auto;padding:8px}
.cmd-item{padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);margin-bottom:6px}
.cmd-item-title{font-size:12px;font-weight:600;margin-bottom:4px}
.cmd-item-desc{font-size:11px;color:var(--text-muted);margin-bottom:8px;line-height:1.4}
.cmd-actions{display:flex;gap:4px}
.cmd-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);font-size:10px;font-weight:600;cursor:pointer;transition:all .12s}
.cmd-btn-approve{background:rgba(63,185,80,.15);color:var(--green);border-color:var(--green)}
.cmd-btn-approve:hover{background:var(--green);color:#fff}
.cmd-btn-dismiss{background:transparent;color:var(--text-muted)}
.cmd-btn-dismiss:hover{background:var(--surface2)}
.cmd-input-area{padding:8px;border-top:1px solid var(--border)}
.cmd-input-row{display:flex;gap:4px}
.cmd-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit}
.cmd-input::placeholder{color:var(--text-dim)}
.cmd-send{padding:6px 12px;border:none;border-radius:5px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.cmd-send:hover{opacity:.85}
.cmd-empty{padding:20px;text-align:center;color:var(--text-dim);font-size:12px}
.cmd-suggestion{font-size:10px;color:var(--cyan);margin-top:4px;font-style:italic}
.cmd-status{font-size:10px;padding:2px 6px;border-radius:3px;margin-left:auto}
.cmd-status-pending{background:rgba(210,153,34,.15);color:var(--yellow)}
.cmd-status-done{background:rgba(63,185,80,.15);color:var(--green)}

/* Detail panel */
#detail{position:fixed;top:0;right:-460px;width:460px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:200;transition:right .2s ease;overflow-y:auto;padding:20px}
#detail.open{right:0}
.detail-close{position:absolute;top:10px;right:12px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px}
.detail-id{font-size:11px;font-family:monospace;color:var(--accent);margin-bottom:4px}
.detail-title{font-size:18px;font-weight:700;margin-bottom:12px}
.detail-section{margin-bottom:16px}
.detail-label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;letter-spacing:.03em}
.detail-value{font-size:13px;color:var(--text);line-height:1.5}
.detail-tags{display:flex;gap:4px;flex-wrap:wrap}
.detail-tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:var(--surface2);color:var(--text-muted)}
.detail-json{background:var(--bg);padding:10px;border-radius:6px;font-size:11px;font-family:monospace;white-space:pre-wrap;max-height:200px;overflow-y:auto;color:var(--text-muted);border:1px solid var(--border)}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:150;display:none}
#overlay.open{display:block}

@media(max-width:900px){.cmd-panel{display:none}}
@media(max-width:768px){.board{flex-direction:column}.col{min-width:100%;max-width:100%}#detail.open{width:100%;right:0}}
</style>
</head>
<body>
<header>
  <div class="logo">Black Hawk <span>| Board</span></div>
  <div class="tabs" role="tablist">
    <button class="active" role="tab" onclick="switchBoard(this,'warroom')" aria-label="War Room board">War Room</button>
    <button role="tab" onclick="switchBoard(this,'standard')" aria-label="Standard board">Standard</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="dot" title="Auto-refresh active"></div>
  <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle dark/light">&#9790;</button>
</header>

<div class="main-area">
  <div class="board-area">
    <div id="board-warroom" class="board"></div>
    <div id="board-standard" class="board hidden"></div>
  </div>

  <!-- Command Center -->
  <div class="cmd-panel" id="cmd-panel">
    <div class="cmd-header">
      <h3>Command Center</h3>
      <button class="cmd-toggle" onclick="toggleCmd()" aria-label="Toggle command panel">&#9776;</button>
    </div>
    <div class="cmd-body" id="cmd-body"></div>
    <div class="cmd-input-area">
      <div class="cmd-input-row">
        <input class="cmd-input" id="cmd-input" placeholder="Send command or card..." onkeydown="if(event.key==='Enter')sendCmd()">
        <button class="cmd-send" onclick="sendCmd()">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="overlay" onclick="closeDetail()"></div>
<div id="detail">
  <button class="detail-close" onclick="closeDetail()" aria-label="Close">&times;</button>
  <div id="detail-content"></div>
</div>

<script>
(function(){
  var P = new URLSearchParams(location.search);
  var REFRESH = (parseInt(P.get('refresh')) || 10) * 1000;
  var cur = 'warroom';
  var wr = {cards:[],counts:{},total:0};
  var pl = {pipelines:[],counts:{}};
  var cmdItems = [];

  // --- Theme ---
  window.toggleTheme = function(){
    var h = document.documentElement;
    if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('didio-board-theme','dark')}
    else{h.setAttribute('data-theme','light');localStorage.setItem('didio-board-theme','light')}
  };

  // --- Board switch ---
  window.switchBoard = function(btn, name){
    cur = name;
    document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    document.getElementById('board-warroom').classList.toggle('hidden', name !== 'warroom');
    document.getElementById('board-standard').classList.toggle('hidden', name !== 'standard');
    updateStats();
  };

  // --- Helpers ---
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
  function relTime(iso){
    if(!iso) return '';
    var d=Date.now()-new Date(iso).getTime(), s=Math.floor(d/1000);
    if(s<60) return s+'s';
    var m=Math.floor(s/60); if(m<60) return m+'m';
    var h=Math.floor(m/60); if(h<24) return h+'h';
    return Math.floor(h/24)+'d';
  }
  function priBadge(p){
    if(!p)return '';
    var c={high:'badge-high',medium:'badge-medium',low:'badge-low',max:'badge-max'}[p]||'badge-low';
    return '<span class="badge '+c+'">'+esc(p)+'</span>';
  }

  // --- COMPACT War Room Card ---
  function wrCard(c){
    var assess = c.overlord_assessment;
    var rec = assess ? assess.recommendation : '';
    var link = c.promoted_to ? ' <span style="color:var(--green);font-size:10px">&#10132; '+esc(c.promoted_to)+'</span>' : '';
    var recBadge = '';
    if(rec==='promote') recBadge='<span class="badge badge-green">promote</span>';
    else if(rec==='defer') recBadge='<span class="badge badge-blue">defer</span>';
    else if(rec==='needs_input') recBadge='<span class="badge badge-high">needs input</span>';
    return '<div class="card" tabindex="0" role="button" onclick=\'showWrDetail("'+esc(c.card_id)+'")\' onkeydown=\'if(event.key==="Enter")showWrDetail("'+esc(c.card_id)+'")\'>'
      +'<div class="card-row"><span class="card-id">'+esc(c.card_id)+'</span>'+priBadge(c.priority_suggestion)+'</div>'
      +'<div class="card-title">'+esc(c.title)+'</div>'
      +'<div class="card-row"><span>'+recBadge+link+'</span><span class="card-sub">'+relTime(c.created_at)+'</span></div>'
      +'</div>';
  }

  // --- COMPACT Standard Card ---
  function stdCard(p){
    var done=(p.stages_completed||[]).length, total=done+(p.stages_remaining||[]).length;
    var pct=total?Math.round(done/total*100):0;
    var color=p.status==='done'?'var(--green)':p.status==='failed'?'var(--red)':'var(--accent)';
    var sub=p.status==='done'?'<span class="badge badge-green">done</span>'
            :p.status==='failed'?'<span class="badge badge-red">exit '+esc(''+(p.exit_code||'?'))+'</span>'
            :'<span class="card-sub">'+esc(p.stage||'')+'</span>';
    return '<div class="card" tabindex="0" role="button" onclick=\'showPlDetail("'+esc(p.feature)+'")\' onkeydown=\'if(event.key==="Enter")showPlDetail("'+esc(p.feature)+'")\'>'
      +'<div class="card-row"><span class="card-id" style="font-size:13px;font-weight:700">'+esc(p.feature)+'</span>'+sub+'</div>'
      +'<div class="card-sub">'+done+'/'+total+' stages</div>'
      +'<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
      +'</div>';
  }

  // --- Render boards ---
  function renderWarroom(){
    var cols=[['incoming','Incoming','var(--text-muted)'],['triaging','Triaging','var(--yellow)'],['needs_input','Assessed','var(--accent)'],['promoted','Promoted','var(--green)'],['deferred','Deferred','var(--text-dim)'],['archived','Archived','var(--text-dim)']];
    document.getElementById('board-warroom').innerHTML = cols.map(function(c){
      var cards = wr.cards.filter(function(x){return(x.status||'incoming')===c[0]});
      return '<div class="col"><div class="col-h" style="border-top:3px solid '+c[2]+'"><span>'+c[1]+'</span><span class="col-cnt">'+cards.length+'</span></div>'
        +'<div class="col-body">'+(cards.length?cards.map(wrCard).join(''):'<div class="col-empty">Empty</div>')+'</div></div>';
    }).join('');
  }

  function renderStandard(){
    var cols=[['planned','Planned','var(--purple)'],['running','In Progress','var(--yellow)'],['review','Review','var(--accent)'],['done','Done','var(--green)'],['failed','Failed','var(--red)'],['paused','Paused','var(--orange)']];
    document.getElementById('board-standard').innerHTML = cols.map(function(c){
      var pipes = pl.pipelines.filter(function(p){
        if(p.status==='done') return c[0]==='done';
        if(p.status==='failed') return c[0]==='failed';
        if(p.status==='paused') return c[0]==='paused';
        var s=(p.stage||'').toLowerCase();
        if(['techlead','qa','post_review'].indexOf(s)>=0) return c[0]==='review';
        if(p.status==='running'||s.indexOf('wave')===0) return c[0]==='running';
        return c[0]==='planned';
      });
      return '<div class="col"><div class="col-h" style="border-top:3px solid '+c[2]+'"><span>'+c[1]+'</span><span class="col-cnt">'+pipes.length+'</span></div>'
        +'<div class="col-body">'+(pipes.length?pipes.map(stdCard).join(''):'<div class="col-empty">Empty</div>')+'</div></div>';
    }).join('');
  }

  function updateStats(){
    var el=document.getElementById('stats');
    if(cur==='warroom'){var c=wr.counts||{};el.innerHTML='<b>'+(c.incoming||0)+'</b> incoming &middot; <b>'+(c.promoted||0)+'</b> promoted &middot; <b>'+(c.deferred||0)+'</b> deferred &middot; <b>'+wr.total+'</b> total'}
    else{var c=pl.counts||{};el.innerHTML='<b>'+(c.running||0)+'</b> running &middot; <b>'+(c.done||0)+'</b> done &middot; <b>'+(c.failed||0)+'</b> failed'}
  }

  // --- Detail panel ---
  window.closeDetail = function(){
    document.getElementById('detail').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  };
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDetail()});

  window.showWrDetail = function(id){
    var card = wr.cards.find(function(c){return c.card_id===id});
    if(!card) return;
    var assess = card.overlord_assessment;
    var html = '<div class="detail-id">'+esc(card.card_id)+'</div>'
      +'<div class="detail-title">'+esc(card.title)+'</div>'
      +'<div class="detail-section"><div class="detail-label">Status</div><div class="detail-value">'+esc(card.status)+' '+priBadge(card.priority_suggestion)+'</div></div>'
      +'<div class="detail-section"><div class="detail-label">Body</div><div class="detail-value">'+esc(card.body||'(no body)')+'</div></div>'
      +'<div class="detail-section"><div class="detail-label">Source</div><div class="detail-value">'+esc(card.source||'operator')+'</div></div>';
    if(card.tags&&card.tags.length){
      html+='<div class="detail-section"><div class="detail-label">Tags</div><div class="detail-tags">'+card.tags.map(function(t){return '<span class="detail-tag">'+esc(t)+'</span>'}).join('')+'</div></div>';
    }
    if(assess){
      html+='<div class="detail-section"><div class="detail-label">Alpha Assessment</div><div class="detail-value">'+esc(assess.recommendation)+'</div></div>';
      if(assess.rationale) html+='<div class="detail-section"><div class="detail-label">Rationale</div><div class="detail-value">'+esc(assess.rationale)+'</div></div>';
    }
    if(card.promoted_to) html+='<div class="detail-section"><div class="detail-label">Promoted To</div><div class="detail-value" style="color:var(--green)">'+esc(card.promoted_to)+'</div></div>';
    html+='<div class="detail-section"><div class="detail-label">Created</div><div class="detail-value">'+esc(card.created_at||'')+'</div></div>';
    if(card.updated_at) html+='<div class="detail-section"><div class="detail-label">Updated</div><div class="detail-value">'+esc(card.updated_at)+'</div></div>';
    html+='<div class="detail-section"><div class="detail-label">Raw JSON</div><div class="detail-json">'+esc(JSON.stringify(card,null,2))+'</div></div>';
    document.getElementById('detail-content').innerHTML=html;
    document.getElementById('detail').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  };

  window.showPlDetail = function(fid){
    var pipe = pl.pipelines.find(function(p){return p.feature===fid});
    if(!pipe) return;
    var done=(pipe.stages_completed||[]).length, total=done+(pipe.stages_remaining||[]).length;
    var html = '<div class="detail-id">Pipeline</div>'
      +'<div class="detail-title">'+esc(pipe.feature)+'</div>'
      +'<div class="detail-section"><div class="detail-label">Status</div><div class="detail-value">'+esc(pipe.status)+'</div></div>'
      +'<div class="detail-section"><div class="detail-label">Stage</div><div class="detail-value">'+esc(pipe.stage||'—')+'</div></div>'
      +'<div class="detail-section"><div class="detail-label">Progress</div><div class="detail-value">'+done+'/'+total+' stages</div></div>';
    if(pipe.exit_code!=null) html+='<div class="detail-section"><div class="detail-label">Exit Code</div><div class="detail-value">'+pipe.exit_code+'</div></div>';
    if(pipe.stages_completed&&pipe.stages_completed.length){
      html+='<div class="detail-section"><div class="detail-label">Completed Stages</div><div class="detail-value">'+pipe.stages_completed.join(', ')+'</div></div>';
    }
    if(pipe.error) html+='<div class="detail-section"><div class="detail-label">Error</div><div class="detail-value" style="color:var(--red)">'+esc(pipe.error)+'</div></div>';
    html+='<div class="detail-section"><div class="detail-label">Raw JSON</div><div class="detail-json">'+esc(JSON.stringify(pipe,null,2))+'</div></div>';
    document.getElementById('detail-content').innerHTML=html;
    document.getElementById('detail').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  };

  // --- Command Center ---
  window.toggleCmd = function(){
    document.getElementById('cmd-panel').classList.toggle('collapsed');
  };

  function buildImpediments(){
    cmdItems = [];
    // Failed pipelines
    pl.pipelines.forEach(function(p){
      if(p.status==='failed'){
        cmdItems.push({type:'failed_pipeline',id:p.feature,title:p.feature+' pipeline failed',
          desc:'Failed at stage: '+(p.stage||'unknown')+'. Exit code: '+(p.exit_code||'?'),
          suggestion:'didio pipeline-resume '+p.feature,sugLabel:'Resume pipeline'});
      }
    });
    // Paused pipelines
    pl.pipelines.forEach(function(p){
      if(p.status==='paused'||p.paused_at){
        cmdItems.push({type:'paused_pipeline',id:p.feature,title:p.feature+' pipeline paused',
          desc:'Paused at: '+(p.paused_at||'unknown')+'. Stage: '+(p.stage||'?'),
          suggestion:'didio pipeline-resume '+p.feature,sugLabel:'Resume pipeline'});
      }
    });
    // Warroom cards needing input
    wr.cards.forEach(function(c){
      var assess=c.overlord_assessment;
      if(assess&&assess.recommendation==='needs_input'){
        cmdItems.push({type:'needs_input',id:c.card_id,title:c.title,
          desc:'Alpha needs operator input. '+(assess.rationale||''),
          suggestion:'didio warroom move '+c.card_id+' triaging',sugLabel:'Move to triaging'});
      }
    });
    // Incoming cards (need triage)
    wr.cards.forEach(function(c){
      if(c.status==='incoming'){
        cmdItems.push({type:'incoming',id:c.card_id,title:c.title,
          desc:'Card awaiting triage by Alpha.',
          suggestion:'didio blackhawk triage',sugLabel:'Run triage'});
      }
    });
    renderCmd();
  }

  function renderCmd(){
    var el=document.getElementById('cmd-body');
    if(!cmdItems.length){el.innerHTML='<div class="cmd-empty">No impediments. All clear.</div>';return}
    el.innerHTML=cmdItems.map(function(it,i){
      var typeColor={failed_pipeline:'var(--red)',paused_pipeline:'var(--orange)',needs_input:'var(--yellow)',incoming:'var(--text-muted)'}[it.type]||'var(--text-muted)';
      return '<div class="cmd-item">'
        +'<div class="card-row"><span class="cmd-item-title" style="color:'+typeColor+'">'+esc(it.title)+'</span></div>'
        +'<div class="cmd-item-desc">'+esc(it.desc)+'</div>'
        +'<div class="cmd-suggestion">Suggestion: '+esc(it.suggestion)+'</div>'
        +'<div class="cmd-actions" style="margin-top:6px">'
        +'<button class="cmd-btn cmd-btn-approve" onclick="approveCmd('+i+')" title="Execute suggestion">Approve</button>'
        +'<button class="cmd-btn cmd-btn-dismiss" onclick="dismissCmd('+i+')" title="Dismiss">Dismiss</button>'
        +'</div></div>';
    }).join('');
  }

  window.approveCmd = function(idx){
    var it=cmdItems[idx];
    if(!it)return;
    fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:it.suggestion,type:it.type,id:it.id})})
    .then(function(r){return r.json()})
    .then(function(){
      cmdItems.splice(idx,1);
      renderCmd();
    }).catch(function(e){alert('Error: '+e.message)});
  };

  window.dismissCmd = function(idx){
    cmdItems.splice(idx,1);
    renderCmd();
  };

  window.sendCmd = function(){
    var input=document.getElementById('cmd-input');
    var text=input.value.trim();
    if(!text)return;
    // Check if it's a card creation (starts with + or "add:")
    if(text.startsWith('+')||text.toLowerCase().startsWith('add:')){
      var title=text.replace(/^\+|^add:\s*/i,'').trim();
      fetch('/api/warroom/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,priority:'medium',tags:['operator']})})
      .then(function(r){return r.json()})
      .then(function(d){
        input.value='';
        if(d.ok) fetchData();
      }).catch(function(e){alert('Error: '+e.message)});
    } else {
      // Generic command
      fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:text})})
      .then(function(r){return r.json()})
      .then(function(){input.value=''})
      .catch(function(e){alert('Error: '+e.message)});
    }
  };

  // --- Data fetching ---
  function fetchData(){
    Promise.all([
      fetch('/api/warroom').then(function(r){return r.json()}),
      fetch('/api/pipelines').then(function(r){return r.json()})
    ]).then(function(res){
      wr=res[0]; pl=res[1];
      renderWarroom(); renderStandard(); updateStats(); buildImpediments();
    }).catch(function(e){console.error('fetch error',e)});
  }
  fetchData();
  setInterval(fetchData, REFRESH);
})();
</script>
</body>
</html>
